<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Top contribution months">
<title>Top contribution months</title><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0066FF"/><stop offset=".52" stop-color="#7272E8"/><stop offset="1" stop-color="#BD39FA"/></linearGradient><linearGradient id="wash-soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C2FF" stop-opacity=".28"/><stop offset=".6" stop-color="#7272E8" stop-opacity=".18"/><stop offset="1" stop-color="#BD39FA" stop-opacity=".22"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00C2FF"/><stop offset="1" stop-color="#7272E8"/></linearGradient><radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset=".18" stop-color="#00C2FF" stop-opacity=".55"/><stop offset=".62" stop-color="#7272E8" stop-opacity=".26"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/></radialGradient><filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="panelGlow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00C2FF" flood-opacity=".2"/><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#BD39FA" flood-opacity=".14"/></filter></defs>
<style>*{box-sizing:border-box}text{font-family:'Fira Code', 'SFMono-Regular', Consolas, monospace;fill:#E6EDF3}.muted{fill:#9BA7B4}.small{font-size:12px}.label{font-size:13px;letter-spacing:1.2px;fill:#9BA7B4}.card-bg{fill:#0D1117;stroke:#293241;stroke-width:1.2}.card-shell{filter:url(#panelGlow)}.ambient-orb{animation:float-y 9s ease-in-out infinite alternate}.ambient-ring{animation:spin-slow 22s linear infinite}.ambient-glow{animation:glow-shift 6s ease-in-out infinite alternate}.scanline{animation:shimmer 10s linear infinite}.card{opacity:0;transform:translateY(18px);animation:card-in .85s cubic-bezier(.2,.8,.2,1) 7.60s forwards} .reveal{opacity:0;animation:reveal .7s ease-out 7.95s forwards} @keyframes card-in{to{opacity:1;transform:translateY(0)}} @keyframes reveal{to{opacity:1}} .pulse{animation:pulse 2.8s ease-in-out 7.60s infinite alternate} @keyframes pulse{to{opacity:.45}} @keyframes float-y{0%{transform:translateY(0px)}50%{transform:translateY(-10px)}100%{transform:translateY(6px)}} @keyframes spin-slow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}} @keyframes glow-shift{0%{opacity:.35;transform:scale(.98)}50%{opacity:.74;transform:scale(1.04)}100%{opacity:.42;transform:scale(.98)}} @keyframes shimmer{0%{opacity:0;transform:translateX(-30px)}20%{opacity:.8}50%{opacity:.3}100%{opacity:0;transform:translateX(24px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;opacity:1!important;transform:none!important}}</style><rect class="card-bg" x="1" y="1" width="998" height="278" rx="22"/><text x="28" y="38" class="" style="font-size:13px;font-weight:700;fill:#00C2FF;">TOP CONTRIBUTION MONTHS</text><text x="35" y="89" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">Jan 2026</text><rect x="145" y="75" width="690" height="17" rx="8" fill="#202833"/><rect x="145" y="75" width="690.0" height="17" rx="8" fill="url(#wash)"><title>251 contributions</title><animate attributeName="width" from="0" to="690.0" dur=".8s" begin="7.70s" fill="freeze"/></rect><text x="855" y="89" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">251</text><text x="35" y="120" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">Jul 2026</text><rect x="145" y="106" width="690" height="17" rx="8" fill="#202833"/><rect x="145" y="106" width="208.9" height="17" rx="8" fill="url(#wash)"><title>76 contributions</title><animate attributeName="width" from="0" to="208.9" dur=".8s" begin="7.84s" fill="freeze"/></rect><text x="855" y="120" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">76</text><text x="35" y="151" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">Oct 2026</text><rect x="145" y="137" width="690" height="17" rx="8" fill="#202833"/><rect x="145" y="137" width="181.4" height="17" rx="8" fill="url(#wash)"><title>66 contributions</title><animate attributeName="width" from="0" to="181.4" dur=".8s" begin="7.98s" fill="freeze"/></rect><text x="855" y="151" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">66</text><text x="35" y="182" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">Aug 2026</text><rect x="145" y="168" width="690" height="17" rx="8" fill="#202833"/><rect x="145" y="168" width="162.2" height="17" rx="8" fill="url(#wash)"><title>59 contributions</title><animate attributeName="width" from="0" to="162.2" dur=".8s" begin="8.12s" fill="freeze"/></rect><text x="855" y="182" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">59</text><text x="35" y="213" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">Jun 2026</text><rect x="145" y="199" width="690" height="17" rx="8" fill="#202833"/><rect x="145" y="199" width="112.7" height="17" rx="8" fill="url(#wash)"><title>41 contributions</title><animate attributeName="width" from="0" to="112.7" dur=".8s" begin="8.26s" fill="freeze"/></rect><text x="855" y="213" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">41</text><text x="35" y="244" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">Feb 2026</text><rect x="145" y="230" width="690" height="17" rx="8" fill="#202833"/><rect x="145" y="230" width="110.0" height="17" rx="8" fill="url(#wash)"><title>40 contributions</title><animate attributeName="width" from="0" to="110.0" dur=".8s" begin="8.40s" fill="freeze"/></rect><text x="855" y="244" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">40</text></svg>
