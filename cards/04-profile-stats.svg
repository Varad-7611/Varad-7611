<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="GitHub profile followers and stars">
<title>GitHub profile followers and stars</title><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0066FF"/><stop offset=".52" stop-color="#7272E8"/><stop offset="1" stop-color="#BD39FA"/></linearGradient><linearGradient id="wash-soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C2FF" stop-opacity=".28"/><stop offset=".6" stop-color="#7272E8" stop-opacity=".18"/><stop offset="1" stop-color="#BD39FA" stop-opacity=".22"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00C2FF"/><stop offset="1" stop-color="#7272E8"/></linearGradient><radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset=".18" stop-color="#00C2FF" stop-opacity=".55"/><stop offset=".62" stop-color="#7272E8" stop-opacity=".26"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/></radialGradient><filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="panelGlow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00C2FF" flood-opacity=".2"/><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#BD39FA" flood-opacity=".14"/></filter></defs>
<style>*{box-sizing:border-box}text{font-family:'Fira Code', 'SFMono-Regular', Consolas, monospace;fill:#E6EDF3}.muted{fill:#9BA7B4}.small{font-size:12px}.label{font-size:13px;letter-spacing:1.2px;fill:#9BA7B4}.card-bg{fill:#0D1117;stroke:#293241;stroke-width:1.2}.card-shell{filter:url(#panelGlow)}.ambient-orb{animation:float-y 9s ease-in-out infinite alternate}.ambient-ring{animation:spin-slow 22s linear infinite}.ambient-glow{animation:glow-shift 6s ease-in-out infinite alternate}.scanline{animation:shimmer 10s linear infinite}.card{opacity:0;transform:translateY(18px);animation:card-in .85s cubic-bezier(.2,.8,.2,1) 1.00s forwards} .reveal{opacity:0;animation:reveal .7s ease-out 1.35s forwards} @keyframes card-in{to{opacity:1;transform:translateY(0)}} @keyframes reveal{to{opacity:1}} .pulse{animation:pulse 2.8s ease-in-out 1.00s infinite alternate} @keyframes pulse{to{opacity:.45}} @keyframes float-y{0%{transform:translateY(0px)}50%{transform:translateY(-10px)}100%{transform:translateY(6px)}} @keyframes spin-slow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}} @keyframes glow-shift{0%{opacity:.35;transform:scale(.98)}50%{opacity:.74;transform:scale(1.04)}100%{opacity:.42;transform:scale(.98)}} @keyframes shimmer{0%{opacity:0;transform:translateX(-30px)}20%{opacity:.8}50%{opacity:.3}100%{opacity:0;transform:translateX(24px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;opacity:1!important;transform:none!important}}</style><rect class="card-bg card-shell" x="1" y="1" width="998" height="168" rx="22"/><g class="ambient-orb"><circle cx="820" cy="50" r="115" fill="url(#wash)" opacity=".10"/></g><text x="28" y="38" class="" style="font-size:13px;font-weight:700;fill:#00C2FF;">GITHUB PROFILE REACH</text><rect class="card-shell" x="28" y="56" width="454" height="88" rx="14" fill="#1C2330" stroke="#293241"/><circle cx="445" cy="100" r="25" fill="#00C2FF" opacity=".10"/><circle cx="445" cy="100" r="18" fill="none" stroke="#00C2FF" stroke-opacity=".45"/><text x="46" y="82" class="" style="font-size:10px;font-weight:600;fill:#9BA7B4;">FOLLOWERS</text><text x="46" y="119" class="" style="font-size:25px;font-weight:700;fill:#00C2FF;">17</text><text x="178" y="117" class="" style="font-size:10px;font-weight:400;fill:#9BA7B4;">people following your work</text><rect class="card-shell" x="506" y="56" width="454" height="88" rx="14" fill="#1C2330" stroke="#293241"/><circle cx="923" cy="100" r="25" fill="#7272E8" opacity=".10"/><circle cx="923" cy="100" r="18" fill="none" stroke="#7272E8" stroke-opacity=".45"/><text x="524" y="82" class="" style="font-size:10px;font-weight:600;fill:#9BA7B4;">REPOSITORY STARS</text><text x="524" y="119" class="" style="font-size:25px;font-weight:700;fill:#7272E8;">66</text><text x="656" y="117" class="" style="font-size:10px;font-weight:400;fill:#9BA7B4;">stars across your public repositories</text></svg>
