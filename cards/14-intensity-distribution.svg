<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="265" viewBox="0 0 1000 265" role="img" aria-label="Contribution intensity distribution">
<title>Contribution intensity distribution</title><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0066FF"/><stop offset=".52" stop-color="#7272E8"/><stop offset="1" stop-color="#BD39FA"/></linearGradient><linearGradient id="wash-soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C2FF" stop-opacity=".28"/><stop offset=".6" stop-color="#7272E8" stop-opacity=".18"/><stop offset="1" stop-color="#BD39FA" stop-opacity=".22"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00C2FF"/><stop offset="1" stop-color="#7272E8"/></linearGradient><radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset=".18" stop-color="#00C2FF" stop-opacity=".55"/><stop offset=".62" stop-color="#7272E8" stop-opacity=".26"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/></radialGradient><filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="panelGlow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00C2FF" flood-opacity=".2"/><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#BD39FA" flood-opacity=".14"/></filter></defs>
<style>*{box-sizing:border-box}text{font-family:'Fira Code', 'SFMono-Regular', Consolas, monospace;fill:#E6EDF3}.muted{fill:#9BA7B4}.small{font-size:12px}.label{font-size:13px;letter-spacing:1.2px;fill:#9BA7B4}.card-bg{fill:#0D1117;stroke:#293241;stroke-width:1.2}.card-shell{filter:url(#panelGlow)}.ambient-orb{animation:float-y 9s ease-in-out infinite alternate}.ambient-ring{animation:spin-slow 22s linear infinite}.ambient-glow{animation:glow-shift 6s ease-in-out infinite alternate}.scanline{animation:shimmer 10s linear infinite}.card{opacity:0;transform:translateY(18px);animation:card-in .85s cubic-bezier(.2,.8,.2,1) 6.80s forwards} .reveal{opacity:0;animation:reveal .7s ease-out 7.15s forwards} @keyframes card-in{to{opacity:1;transform:translateY(0)}} @keyframes reveal{to{opacity:1}} .pulse{animation:pulse 2.8s ease-in-out 6.80s infinite alternate} @keyframes pulse{to{opacity:.45}} @keyframes float-y{0%{transform:translateY(0px)}50%{transform:translateY(-10px)}100%{transform:translateY(6px)}} @keyframes spin-slow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}} @keyframes glow-shift{0%{opacity:.35;transform:scale(.98)}50%{opacity:.74;transform:scale(1.04)}100%{opacity:.42;transform:scale(.98)}} @keyframes shimmer{0%{opacity:0;transform:translateX(-30px)}20%{opacity:.8}50%{opacity:.3}100%{opacity:0;transform:translateX(24px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;opacity:1!important;transform:none!important}}</style><rect class="card-bg" x="1" y="1" width="998" height="263" rx="22"/><text x="28" y="38" class="" style="font-size:13px;font-weight:700;fill:#00C2FF;">DAILY CONTRIBUTION INTENSITY</text><rect x="42.0" y="93" width="648.9" height="35" rx="5" fill="#27313D"><title>0 contributions/day: 260 days</title><animate attributeName="width" from="0" to="648.9" dur=".9s" begin="6.9s" fill="freeze"/></rect><rect x="690.9" y="93" width="92.3" height="35" rx="5" fill="#173C62"><title>1–2 contributions/day: 37 days</title><animate attributeName="width" from="0" to="92.3" dur=".9s" begin="6.9s" fill="freeze"/></rect><rect x="783.3" y="93" width="74.9" height="35" rx="5" fill="#145B91"><title>3–5 contributions/day: 30 days</title><animate attributeName="width" from="0" to="74.9" dur=".9s" begin="6.9s" fill="freeze"/></rect><rect x="858.2" y="93" width="52.4" height="35" rx="5" fill="#0066FF"><title>6–9 contributions/day: 21 days</title><animate attributeName="width" from="0" to="52.4" dur=".9s" begin="6.9s" fill="freeze"/></rect><rect x="910.6" y="93" width="47.4" height="35" rx="5" fill="#00C2FF"><title>10+ contributions/day: 19 days</title><animate attributeName="width" from="0" to="47.4" dur=".9s" begin="6.9s" fill="freeze"/></rect><rect x="44" y="150" width="11" height="11" rx="2" fill="#27313D"/><text x="66" y="160" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">0 contributions/day</text><text x="360" y="160" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">260 days</text><text x="490" y="160" class="" style="font-size:11px;font-weight:600;fill:#27313D;">70.8%</text><rect x="44" y="169" width="11" height="11" rx="2" fill="#173C62"/><text x="66" y="179" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">1–2 contributions/day</text><text x="360" y="179" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">37 days</text><text x="490" y="179" class="" style="font-size:11px;font-weight:600;fill:#173C62;">10.1%</text><rect x="44" y="188" width="11" height="11" rx="2" fill="#145B91"/><text x="66" y="198" class="" style="font-size:11px;font-weight:400;fill:#9BA7B4;">3–5 contributions/day</text><text x="360" y="198" class="" style="font-size:11px;font-weight:600;fill:#E6EDF3;">30 days</text><text x="490" y="198" class="" style="font-size:11px;font-weight:600;fill:#145B91;">8.2%</text><rect x="44" y="207" width="11" height="11" rx="2" fill="#0066FF"/><text x="66" y="217" class="" style="font-size:11px;font-weigh